name: Woven Software
description: Woven Software, Inc. (Woven, woven.com) was a Mountain View, California
  startup that built an AI-powered calendar and scheduling application for professionals,
  raising roughly $4.8M from investors including Battery Ventures, Felicis, Amplify
  Partners, Salesforce Ventures, and the Slack Fund. Slack acquired the Woven team
  in an acqui-hire announced in April 2021 and the Woven calendar product was shut
  down; the company no longer operates and publishes no APIs, developer portal, or
  other public API artifacts. The woven.com domain no longer serves the product
  (HTTPS fails; registration is behind a privacy service). This profile records the
  company as an exited Battery Ventures portfolio investment with no remaining API
  surface.
